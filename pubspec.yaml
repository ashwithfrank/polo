name: polo
description: "A new Flutter project."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0
  open_filex: ^5.0.0
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFF6E9"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#FFF6E9"
  image: assets/icon/splash_logo.png
  color_dark: "#1C1612"
  image_dark: assets/icon/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFF6E9"
    image: assets/icon/splash_logo.png
    color_dark: "#1C1612"
    image_dark: assets/icon/splash_logo.png
  fullscreen: false